            text-shadow: 0 0 10px rgba(252, 163, 17, 0.3);
        }
        .section {
            margin-top: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        }

        input {

            border: 2px solid #fca311;
            border-radius: 12px;
            background: #2b2b2b;
            color: white;
            font-size: 18px;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            margin-bottom: 15px;
        }
        input::placeholder {

        }
        input:focus {

            box-shadow: 0 0 15px rgba(255, 183, 3, 0.5);

        }
        .result-box {

        }
        .result {
            font-size: 24px;
            font-weight: bold;
            color: #8ecae6;
            opacity: 0;
            transition: opacity 0.3s ease;

        .result.show {

        .error {

        const reverseDictionary = {};
        for (const [imposed, repressed] of Object.entries(dictionary)) {

            const parts = repressed.split(',').map(s => s.trim());
            parts.forEach(part => {
                if (!reverseDictionary[part]) {
                    reverseDictionary[part] = [];
                }

                if (!reverseDictionary[part].includes(imposed)) {
                    reverseDictionary[part].push(imposed);
                }
            });
        }


        const input1 = document.getElementById('wordInput1');
        const resultDisplay1 = document.getElementById('resultDisplay1');

        input1.addEventListener('input', function() {
            const word = this.value.trim().toLowerCase(); 
            handleSearch(word, dictionary, resultDisplay1, false);
        });

        // Логіка для другого поля (шукаємо кальку/нав'язане навпаки)
        const input2 = document.getElementById('wordInput2');
        const resultDisplay2 = document.getElementById('resultDisplay2');

        input2.addEventListener('input', function() {
            const word = this.value.trim().toLowerCase(); 
            handleSearch(word, reverseDictionary, resultDisplay2, true);
        });

        function handleSearch(word, dictTarget, displayElement, isReverse) {
            if (word === '') {
                displayElement.classList.remove('show');
                setTimeout(() => {
                    displayElement.textContent = '';
                    displayElement.className = 'result';
                }, 300);
                return;
            }

            if (dictTarget[word]) {

                displayElement.textContent = isReverse ? dictTarget[word].join(', ') : dictTarget[word];
                displayElement.className = 'result show';
            } else {
                displayElement.textContent = 'Слово не знайдено';
                displayElement.className = 'result error show';
